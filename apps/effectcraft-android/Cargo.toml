[package]
name = "effectcraft-android"
description = "EffectCraft native Android app"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib"]

[lints]
workspace = true

[dependencies]
effectcraft-engine = { workspace = true }
effectcraft-host = { workspace = true }
effectcraft-ui-egui = { workspace = true }
eframe = { workspace = true, features = ["default_fonts", "wgpu", "clipboard", "android-native-activity"] }
egui = { workspace = true }
log = { workspace = true }

[target.'cfg(target_os = "android")'.dependencies]
android-activity = "0.6.1"

[package.metadata.android]
package = "ai.storyteller.effectcraft"
apk_name = "EffectCraft"
min_sdk_version = 26
target_sdk_version = 35
build_targets = ["aarch64-linux-android", "armv7-linux-androideabi"]

[package.metadata.android.application]
label = "EffectCraft"
theme = "@android:style/Theme.Material.NoActionBar"
orientation = "fullSensor"
uses_cleartext_traffic = false
